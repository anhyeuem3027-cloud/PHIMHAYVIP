
name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          set -euo pipefail

          xcodebuild \
            -project PHIMHAYVIP.xcodeproj \
            -scheme PHIMHAYVIP \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Verify and repair app metadata
        run: |
          set -euo pipefail

          APP="build/Build/Products/Release-iphoneos/PHIMHAYVIP.app"
          PLIST="$APP/Info.plist"

          test -d "$APP" || {
            echo "::error::PHIMHAYVIP.app not found"
            exit 1
          }

          test -f "$PLIST" || {
            echo "::error::Info.plist not found"
            exit 1
          }

          echo "Checking executable..."

          EXECUTABLE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleExecutable" "$PLIST" 2>/dev/null || true)

          if [ -z "$EXECUTABLE" ]; then
            if [ -f "$APP/PHIMHAYVIP" ]; then
              EXECUTABLE="PHIMHAYVIP"
            else
              echo "::error::Cannot find PHIMHAYVIP executable"
              echo "App bundle contents:"
              ls -la "$APP"
              exit 1
            fi

            /usr/libexec/PlistBuddy \
              -c "Add :CFBundleExecutable string $EXECUTABLE" "$PLIST"
          fi

          if [ ! -f "$APP/$EXECUTABLE" ]; then
            echo "::error::Executable not found: $APP/$EXECUTABLE"
            ls -la "$APP"
            exit 1
          fi

          PACKAGE_TYPE=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundlePackageType" "$PLIST" 2>/dev/null || true)

          if [ -z "$PACKAGE_TYPE" ]; then
            /usr/libexec/PlistBuddy \
              -c "Add :CFBundlePackageType string APPL" "$PLIST"
          fi

          echo "Executable verified: $EXECUTABLE"
          plutil -lint "$PLIST"

      - name: Package and verify IPA
        run: |
          set -euo pipefail

          rm -rf package Payload PHIMHAYVIP-unsigned.ipa
          mkdir -p package/Payload

          cp -R \
            build/Build/Products/Release-iphoneos/PHIMHAYVIP.app \
            package/Payload/

          cd package
          /usr/bin/zip -qry ../PHIMHAYVIP-unsigned.ipa Payload
          cd ..

          unzip -t PHIMHAYVIP-unsigned.ipa

          unzip -l PHIMHAYVIP-unsigned.ipa \
            | grep 'Payload/PHIMHAYVIP.app/Info.plist'

          echo "IPA package:"
          ls -lh PHIMHAYVIP-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PHIMHAYVIP-IPA
          path: PHIMHAYVIP-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
