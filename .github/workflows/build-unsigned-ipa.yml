
name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app
        run: |
          set -euo pipefail

          xcodebuild \
            -project PHIMHAYVIP.xcodeproj \
            -scheme PHIMHAYVIP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Verify and package IPA
        run: |
          set -euo pipefail

          APP_PATH="$PWD/build/Build/Products/Release-iphoneos/PHIMHAYVIP.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: PHIMHAYVIP.app not found"
            exit 1
          fi

          INFO_PLIST="$APP_PATH/Info.plist"

          if [ ! -f "$INFO_PLIST" ]; then
            echo "ERROR: Info.plist missing"
            exit 1
          fi

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$INFO_PLIST")

          if [ ! -f "$APP_PATH/$EXECUTABLE" ]; then
            echo "ERROR: App executable missing: $EXECUTABLE"
            exit 1
          fi

          rm -rf Payload PHIMHAYVIP-unsigned.ipa
          mkdir -p Payload

          ditto "$APP_PATH" "Payload/PHIMHAYVIP.app"

          /usr/bin/zip -qry PHIMHAYVIP-unsigned.ipa Payload

          unzip -t PHIMHAYVIP-unsigned.ipa

          echo "IPA package created:"
          ls -lh PHIMHAYVIP-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PHIMHAYVIP-unsigned-IPA
          path: PHIMHAYVIP-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
