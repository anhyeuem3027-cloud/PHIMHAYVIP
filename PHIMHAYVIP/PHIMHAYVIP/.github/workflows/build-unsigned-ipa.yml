
name: Build PHIMHAY VIP IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build IPA
        run: |
          xcodebuild \
            -project PHIMHAYVIP.xcodeproj \
            -scheme PHIMHAYVIP \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PHIMHAYVIP.app Payload/
          zip -qry PHIMHAYVIP-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PHIMHAYVIP-IPA
          path: PHIMHAYVIP-unsigned.ipa
