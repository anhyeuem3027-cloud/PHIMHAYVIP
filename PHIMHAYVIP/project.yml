    type: application
    platform: iOS

    sources:
      - PHIMHAYVIP

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.io.phimhayvip.app
        INFOPLIST_FILE: PHIMHAYVIP/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
